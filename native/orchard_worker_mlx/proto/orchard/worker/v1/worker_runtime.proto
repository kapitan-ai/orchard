syntax = "proto3";

package orchard.worker.v1;

import "cluster/v1/common.proto";
import "cluster/v1/events.proto";
import "cluster/v1/runtime.proto";

message WorkerStatusRequest {}

message WorkerMemoryBudgetStatus {
  string mode = 1;
  bool budget_available = 2;
  bool headroom_available = 3;
  // Observe-only status vocabulary in the current slice:
  // ok | disabled | device_info_unavailable | device_info_invalid |
  // resident_memory_unavailable | compute_failed | invalid_status.
  // Non-enforcement: status_code is not an enforcement input in this slice and
  // MUST NOT alter readiness, request admission, model admission, scheduler
  // eligibility, hosted-tool eligibility, or memory_budget_mode enforcement.
  string status_code = 4;
  string status_message = 5;
  string source = 6;
  uint64 max_recommended_working_set_size_bytes = 7;
  double utilization = 8;
  uint64 target_working_set_bytes = 9;
  uint64 overhead_bytes = 10;
  // Static manifest-derived lower-bound/payload-size estimate copied from the
  // model bundle. Not a runtime memory probe and not an enforcement input in
  // this slice; observe-only and non-gating.
  uint64 resident_memory_bytes = 11;
  uint64 estimated_headroom_bytes = 12;
  uint64 kv_cache_bytes_per_token = 13;
  uint64 prefill_workspace_bytes_per_token = 14;
}

message WorkerPrefixCacheStatus {
  string implementation = 1;
  bool enabled = 2;
  uint32 entry_count = 3;
  uint64 total_bytes = 4;
  uint64 hits = 5;
  uint64 misses = 6;
  uint64 failures = 7;
  uint64 stores = 8;
  uint64 evictions = 9;
  uint32 configured_max_entries = 10;
  uint64 configured_max_bytes = 11;
  // Observe-only status vocabulary in the current slice:
  // ok | disabled | unavailable | invalid_status | error.
  // Non-enforcement: prefix-cache status is informational in this slice and
  // MUST NOT alter runtime readiness, request admission, model admission,
  // scheduler eligibility, queue ordering, hosted-tool eligibility, or
  // memory_budget_mode enforcement.
  string status_code = 12;
  string status_message = 13;
  uint64 session_started_unix_ms = 14;
  repeated string prefix_cache_fingerprints = 15;
}

message WorkerStatusResponse {
  bool loaded = 1;
  uint32 active_request_count = 2;
  bool ready = 3;
  string health_code = 4;
  string health_message = 5;
  WorkerMemoryBudgetStatus memory_budget = 6;
  WorkerPrefixCacheStatus prefix_cache = 7;
}

message LoadModelRequest {
  string model_id = 1;
  string version = 2;
  string model_path = 3;
}

service WorkerRuntimeService {
  rpc GetStatus(WorkerStatusRequest) returns (WorkerStatusResponse);
  rpc LoadModel(LoadModelRequest) returns (cluster.v1.Ack);
  rpc UnloadModel(cluster.v1.UnloadModelRequest) returns (cluster.v1.Ack);
  rpc Generate(cluster.v1.ExecuteInferenceRequest) returns (stream cluster.v1.InferenceEvent);
  rpc Cancel(cluster.v1.CancelInferenceRequest) returns (cluster.v1.Ack);
  // Phase 4D selected-candidate observe-only score path.
  // Worker accepts only cache_affinity_fingerprint HMAC input in v1; prompt
  // bytes and token IDs are explicitly out of scope for this RPC.
  // Default-off/fail-open behavior is enforced by node-agent/controller callers.
  rpc ScorePrefixCache(cluster.v1.ScorePrefixCacheRequest)
      returns (cluster.v1.ScorePrefixCacheResponse);
}
