[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orchard-worker-mlx"
version = "0.1.0"
description = "Orchard MLX worker runtime scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.83.1",
  "protobuf>=6.33.5",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.32.2",
  "mlx-lm==0.31.3",
  # Issue #98 pins the audited 15-commit / 35-file delta from v0.31.3.
  # Keep the Transformers 5.13 compatibility matrix as a separate lock change.
  "transformers>=5.7,<5.13",
  "numpy>=1.26.0",
]

[tool.uv.sources]
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm.git", rev = "ab1806e8f5d6aa035973af194a1b9198ab4754dc" }

[project.scripts]
orchard-worker-mlx = "orchard_worker_mlx.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/orchard_worker_mlx/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/orchard_worker_mlx"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/orchard_worker_mlx"]
