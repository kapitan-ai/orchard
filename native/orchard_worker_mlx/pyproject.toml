[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "orchard-worker-mlx"
version = "0.1.0"
description = "Orchard MLX worker runtime scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.78.0",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.31.2",
  "mlx-lm>=0.31.3",
  # Issue #57: transformers 5.13 tightens _LazyAutoMapping.register, so mlx-lm
  # 0.31.3's string NewlineTokenizer config key fails at import. Lift once mlx-lm fixes it.
  "transformers>=5.0.0,<5.13",
  "protobuf>=6.33.5",
  "numpy>=1.26.0",
]

[project.scripts]
orchard-worker-mlx = "orchard_worker_mlx.cli:main"

[dependency-groups]
dev = [
  "grpcio-tools>=1.71.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/orchard_worker_mlx/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/orchard_worker_mlx"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/orchard_worker_mlx"]
