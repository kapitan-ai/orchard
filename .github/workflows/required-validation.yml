name: Orchard CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: orchard-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCHARD_TEST_NODE_AGENT_PORT: "15171"
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE_TEST: orchard_test

jobs:
  # Lane selection lives in job-level `if:` conditions, never in workflow-level
  # `paths-ignore`: a workflow skipped by path filtering leaves its required
  # checks stuck in "Pending" and blocks merging (see GitHub docs, "Handling
  # skipped but required checks").
  changes:
    name: Classify required validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      portable: ${{ steps.classify.outputs.portable }}
      conformance: ${{ steps.classify.outputs.conformance }}
      macos: ${{ steps.classify.outputs.macos }}
      mlx: ${{ steps.classify.outputs.mlx }}
      packaging: ${{ steps.classify.outputs.packaging }}
      app_distribution: ${{ steps.classify.outputs.app_distribution }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail

          # The committed Distribution Pause Control decides whether the
          # Orchard.app and DMG assembly lane is applicable (SPEC.md §11.0).
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf '%s=true\n' portable conformance macos mlx packaging \
              | scripts/ci/resolve-app-distribution-lane.sh \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_paths="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"; then
            printf 'Unable to diff %s..%s; refusing to classify validation lanes.\n' \
              "$BASE_SHA" "$HEAD_SHA" >&2
            exit 1
          fi

          printf '%s\n' "$changed_paths" \
            | scripts/ci/classify-required-validation-paths.sh \
            | scripts/ci/resolve-app-distribution-lane.sh \
            >> "$GITHUB_OUTPUT"

      - name: Test validation fan-out and aggregate gate
        run: |
          scripts/ci/test-classify-required-validation-paths.sh
          scripts/ci/test-required-validation-gate.sh
          scripts/ci/test-platform-test-routing.sh
          scripts/ci/test-app-distribution-lane.sh
          scripts/ci/test-linux-portable-validation-report.sh

      - name: Test distribution pause guards
        run: scripts/test-distribution-control.sh

  linux-portable:
    name: Linux portable control-plane core
    needs: changes
    if: needs.changes.outputs.portable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Report steps are diagnostic: they never fail the lane, and a missing
      # or incomplete report means unknown, never success (docs/tooling.md).
      - name: Start validation report
        continue-on-error: true
        env:
          ORCHARD_REPORT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORCHARD_REPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_DIR: ${{ runner.temp }}/orchard-linux-portable-report
        run: |
          scripts/ci/linux-portable-validation-report.sh start "$REPORT_DIR"
          scripts/ci/linux-portable-validation-report.sh source "$REPORT_DIR"
          scripts/ci/linux-portable-validation-report.sh lockfiles "$REPORT_DIR" before

      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: false

      - name: Validate Product Version consistency
        run: make validate-product-version

      - name: Install portable dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes acl
          make setup-elixir
          mise exec -- uv sync --locked --directory native/orchard_tokenizer
          mise exec -- uv sync --locked --directory native/orchard_worker_mlx

      # `mise current` reports the configured toolchain; the runtime probes
      # report what each installed runtime says. Probes never install tools
      # or create environments: mise auto-install is off for this step only,
      # and uv discovers each package's existing .venv interpreter; only a path
      # inside that .venv counts, and its version is read from that exact path
      # (absent, incompatible, or fallback interpreters mean unknown).
      # The PostgreSQL probe is a read-only SHOW; only its numeric value is kept.
      - name: Record setup identity
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
          PGCONNECT_TIMEOUT: "5"
          REPORT_DIR: ${{ runner.temp }}/orchard-linux-portable-report
        run: |
          # Collect every fact possible; a missing fact is recorded as unknown.
          set +e
          report=scripts/ci/linux-portable-validation-report.sh
          probe() { timeout 60 "$@" 2>/dev/null | head -n 1; }
          "$report" lockfiles "$REPORT_DIR" after
          {
            printf 'mise %s\n' "$(probe mise --version | awk '{ print $1 }')"
            timeout 60 mise current 2>/dev/null
          } | "$report" tools "$REPORT_DIR"
          {
            printf 'erlang %s\n' "$(probe mise exec -- erl -noshell -eval \
              '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
            printf 'elixir %s\n' "$(probe mise exec -- elixir --short-version)"
            printf 'uv %s\n' "$(probe mise exec -- uv --version | awk '{ print $2 }')"
            root="$(pwd -P)"
            for package in orchard_tokenizer orchard_worker_mlx; do
              found="$(probe mise exec -- uv python find --directory "native/$package")"
              version=""
              case "$found" in
                *..*) ;;
                "$root/native/$package/.venv/bin/"*)
                  version="$(probe mise exec -- uv python find --no-project --show-version "$found")" ;;
              esac
              printf 'python_%s %s\n' "${package#orchard_}" "$version"
            done
          } | "$report" runtime "$REPORT_DIR"
          probe psql -X -A -t -c 'SHOW server_version_num' | "$report" postgres "$REPORT_DIR"

      - name: Prove portable compilation excludes Darwin helpers
        run: scripts/test-portable-core-compilation.sh

      - name: Prepare test database
        run: |
          MIX_ENV=test mise exec -- mix ecto.create
          MIX_ENV=test mise exec -- mix ecto.migrate

      - name: Cache Dialyzer PLTs
        id: dialyzer-plt
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.mix/dialyxir_erlang-*.plt
            _build/dev/dialyxir_erlang-*_elixir-*_deps-dev.plt
            _build/dev/dialyxir_erlang-*_elixir-*_deps-dev.plt.hash
          key: orchard-dialyzer-plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mix.lock', 'mix.exs', 'apps/*/mix.exs') }}

      # Re-evaluates the unchanged cache key expression above (actions/cache
      # exposes only cache-hit) and records its SHA-256 identity.
      - name: Record cache identity
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DIALYZER_PLT_CACHE_HIT: ${{ steps.dialyzer-plt.outputs.cache-hit }}
          DIALYZER_PLT_KEY: orchard-dialyzer-plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
          DIALYZER_PLT_OUTCOME: ${{ steps.dialyzer-plt.outcome }}
          REPORT_DIR: ${{ runner.temp }}/orchard-linux-portable-report
        run: >-
          scripts/ci/linux-portable-validation-report.sh cache "$REPORT_DIR" dialyzer_plt
          "$DIALYZER_PLT_OUTCOME" "$DIALYZER_PLT_CACHE_HIT" "$DIALYZER_PLT_KEY"

      - name: Run portable static gates
        run: |
          mise exec -- mix format --check-formatted
          mise exec -- mix compile --warnings-as-errors
          mise exec -- mix credo --strict
          mise exec -- mix dialyzer

      - name: Stage Linux Transport publication helpers
        run: make linux-native-test-helpers

      - name: Run portable tests and coverage
        env:
          ORCHARD_LINUX_PORTABLE_REPORT_DIR: ${{ runner.temp }}/orchard-linux-portable-report
        run: scripts/test-linux-portable-core.sh

      - name: Validate Transport publication against a second UID
        run: scripts/test-transport-publication-second-uid.sh

      # Writes the publication receipt only after a successful finalize has
      # published report.txt as a regular, non-symlink file.
      - name: Finalize validation report
        id: finalize-report
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT_DIR: ${{ runner.temp }}/orchard-linux-portable-report
        run: |
          scripts/ci/linux-portable-validation-report.sh finalize "$REPORT_DIR" "$JOB_STATUS"
          if [[ -f "$REPORT_DIR/report.txt" && ! -L "$REPORT_DIR/report.txt" ]]; then
            printf 'published=true\n' >> "$GITHUB_OUTPUT"
          fi

      # Uploads only report.txt, and only when the finalize step itself
      # succeeded (its outcome, before continue-on-error) and wrote its receipt.
      # A failed, cancelled, or skipped finalize, or a non-file report.txt,
      # uploads nothing. The staging file and raw output are never uploaded.
      - name: Upload validation report
        if: always() && steps.finalize-report.outcome == 'success' && steps.finalize-report.outputs.published == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-portable-validation-report-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orchard-linux-portable-report/report.txt
          if-no-files-found: warn
          retention-days: 14

  provider-conformance:
    name: Provider-neutral conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: false

      - name: Install conformance dependencies
        run: |
          make setup-elixir
          mise exec -- uv sync --locked --directory native/orchard_worker_mlx
          mise exec -- mix escript.install hex protobuf 0.16.0 --force

      - name: Prepare test database
        run: |
          MIX_ENV=test mise exec -- mix ecto.create
          MIX_ENV=test mise exec -- mix ecto.migrate

      - name: Run provider-neutral conformance tests
        run: scripts/test-provider-neutral-conformance.sh

  macos-host:
    name: macOS host validation
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision deterministic Postgres
        run: |
          # macOS runners have no Docker service containers, so this lane
          # provisions its own Postgres instead of using `services:`.
          brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"

      - name: Start Postgres
        run: |
          pgdata="$RUNNER_TEMP/pgdata"
          initdb --username="$PGUSER" --auth=trust --encoding=UTF8 --pgdata="$pgdata"
          pg_ctl --pgdata="$pgdata" --log="$RUNNER_TEMP/postgres.log" \
            --options="-p $PGPORT -k $RUNNER_TEMP" --wait start
          pg_isready --host="$PGHOST" --port="$PGPORT" --username="$PGUSER"

      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: false

      - name: Install Elixir dependencies
        run: make setup-elixir

      - name: Prepare test database
        run: |
          MIX_ENV=test mise exec -- mix ecto.create
          MIX_ENV=test mise exec -- mix ecto.migrate

      - name: Run portable helper transport tests on BSD stat
        run: >-
          mise exec -- mix test
          apps/orchard_controller/test/orchard/tokenizer_client_test.exs
          apps/orchard_controller/test/orchard/models/bundle_builder_test.exs
          apps/orchard_controller/test/orchard/models/safe_tokenization_preflight_test.exs

      - name: Test explicit macOS native-helper boundary
        run: |
          scripts/test-portable-core-compilation.sh
          scripts/test-build-macos-native-helpers.sh
          make macos-native-test-helpers
          mise exec -- mix test --only macos

      - name: Test Transport private-stage publication
        run: |
          mise exec -- mix test \
            apps/orchard_cli/test/orchard_cli/transport_publication_test.exs \
            apps/orchard_cli/test/orchard_cli/commands/transport_test.exs
          scripts/test-transport-publication-second-uid.sh

  mlx-validation:
    name: MLX provider validation
    needs: changes
    if: needs.changes.outputs.mlx == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: false

      - name: Bootstrap MLX environment from lockfile
        run: |
          mise exec -- uv sync --locked --directory native/orchard_worker_mlx --extra mlx
          mise exec -- native/orchard_worker_mlx/bin/orchard-worker-mlx --help >/dev/null

      - name: Validate MLX-LM security baseline
        run: >-
          mise exec -- uv run --locked --directory native/orchard_worker_mlx --extra mlx
          pytest

  # Payload, signing-contract, Swift package, relocated-root lifecycle, and
  # packaged orchardctl checks. It never assembles Orchard.app or a DMG.
  packaging-validation:
    name: Packaging contract validation
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision deterministic Postgres
        run: |
          # macOS runners have no Docker service containers, so this lane
          # provisions its own Postgres instead of using `services:`.
          brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"

      - name: Start Postgres
        run: |
          pgdata="$RUNNER_TEMP/pgdata"
          initdb --username="$PGUSER" --auth=trust --encoding=UTF8 --pgdata="$pgdata"
          pg_ctl --pgdata="$pgdata" --log="$RUNNER_TEMP/postgres.log" \
            --options="-p $PGPORT -k $RUNNER_TEMP" --wait start
          pg_isready --host="$PGHOST" --port="$PGPORT" --username="$PGUSER"

      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: false

      - name: Install repository dependencies
        run: make setup

      - name: Prepare test database
        run: |
          MIX_ENV=test mise exec -- mix ecto.create
          MIX_ENV=test mise exec -- mix ecto.migrate

      - name: Test retained payload and signing contracts
        run: |
          scripts/test-build-payload.sh
          scripts/test-payload-signing-contracts.sh

      - name: Test Orchard.app package and service lifecycle
        run: |
          xcrun swift-format lint --recursive packaging/app/Sources packaging/app/Tests
          swift build --package-path packaging/app
          swift test --package-path packaging/app
          swift test --package-path packaging/app --enable-code-coverage
          scripts/test-app-service-lifecycle.sh

      - name: Test packaged orchardctl
        run: |
          scripts/test-payload-orchardctl-controller-runtime.sh
          scripts/test-payload-orchardctl-console-pty.sh
          scripts/test-payload-orchardctl-controller-release.sh

  # Dormant while packaging/distribution-control is paused (SPEC.md §11.0):
  # the classifier then reports app_distribution=false and the gate requires
  # this job to be skipped.
  app-distribution-validation:
    name: Orchard.app and DMG assembly validation
    needs: changes
    if: needs.changes.outputs.app_distribution == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # verify-app-signing.sh runs the payload closure check through
      # `mise exec`, so the pinned toolchain is required here.
      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: false

      - name: Test Orchard.app assembly, signing, and DMG handoff
        run: |
          scripts/test-build-app.sh
          scripts/test-app-signing.sh
          scripts/test-build-dmg.sh

  openspec-validation:
    name: OpenSpec validation
    needs: changes
    if: needs.changes.outputs.portable == 'true' || needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.9.2
          cache: true

      - name: Install OpenSpec dependencies
        run: make setup-openspec

      - name: Validate OpenSpec
        env:
          OPENSPEC_TELEMETRY: "0"
        run: mise exec -- npm run openspec -- validate --all --strict --no-interactive

  # This job name is the required status check in branch protection. Renaming it
  # silently drops the gate, so keep the name and add new lanes to `needs`
  # plus the evaluator inputs instead.
  required-validation-gate:
    name: Required Orchard validation gate
    needs:
      - changes
      - linux-portable
      - provider-conformance
      - macos-host
      - mlx-validation
      - packaging-validation
      - app-distribution-validation
      - openspec-validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate required validation results
        env:
          APP_DISTRIBUTION_REQUIRED: ${{ needs.changes.outputs.app_distribution }}
          APP_DISTRIBUTION_RESULT: ${{ needs.app-distribution-validation.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONFORMANCE_REQUIRED: ${{ needs.changes.outputs.conformance }}
          CONFORMANCE_RESULT: ${{ needs.provider-conformance.result }}
          MACOS_REQUIRED: ${{ needs.changes.outputs.macos }}
          MACOS_RESULT: ${{ needs.macos-host.result }}
          MLX_REQUIRED: ${{ needs.changes.outputs.mlx }}
          MLX_RESULT: ${{ needs.mlx-validation.result }}
          OPENSPEC_REQUIRED: ${{ needs.changes.outputs.portable == 'true' || needs.changes.outputs.conformance == 'true' }}
          OPENSPEC_RESULT: ${{ needs.openspec-validation.result }}
          PACKAGING_REQUIRED: ${{ needs.changes.outputs.packaging }}
          PACKAGING_RESULT: ${{ needs.packaging-validation.result }}
          PORTABLE_REQUIRED: ${{ needs.changes.outputs.portable }}
          PORTABLE_RESULT: ${{ needs.linux-portable.result }}
        run: scripts/ci/evaluate-required-validation.sh
