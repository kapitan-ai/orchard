name: Dependency submission

# GitHub's dependency graph cannot read mix.lock. Submitting the Mix
# dependency snapshot from main gives Hex packages Dependabot alerts
# (docs/tooling.md, "Supply-Chain Checks"). Pull requests do not submit.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mix:
    name: Submit Mix dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required by the Dependency Submission API
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action downloads its release binary and verifies its build
      # provenance with `gh attestation verify` before running it.
      - name: Submit Mix dependency snapshot
        uses: erlef/mix-dependency-submission@257b2df58056895d7a0f3f7dba5b0520d71d9a46 # v1.3.4
