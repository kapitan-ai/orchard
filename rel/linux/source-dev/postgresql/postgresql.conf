listen_addresses = ''
port = 5432
unix_socket_directories = '/run/postgresql'
unix_socket_group = 'orchard-postgresql'
unix_socket_permissions = 0770
ssl = off
hba_file = '/etc/orchard/postgresql/pg_hba.conf'
ident_file = '/etc/orchard/postgresql/pg_ident.conf'
external_pid_file = '/run/postgresql/orchard-16.pid'
logging_collector = on
log_directory = '/var/log/orchard/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d '
shared_preload_libraries = ''
fsync = on
full_page_writes = on
synchronous_commit = on
