syntax = "proto3";

package orchard.worker.v1;

import "cluster/v1/common.proto";
import "cluster/v1/events.proto";
import "cluster/v1/runtime.proto";

message WorkerStatusRequest {}

message WorkerMemoryBudgetStatus {
  string mode = 1;
  bool budget_available = 2;
  bool headroom_available = 3;
  // Observe-only status vocabulary in the current slice:
  // ok | disabled | device_info_unavailable | device_info_invalid |
  // resident_memory_unavailable | compute_failed | invalid_status.
  // Non-enforcement: status_code is not an enforcement input in this slice and
  // MUST NOT alter readiness, request admission, model admission, scheduler
  // eligibility, hosted-tool eligibility, or memory_budget_mode enforcement.
  string status_code = 4;
  string status_message = 5;
  string source = 6;
  uint64 max_recommended_working_set_size_bytes = 7;
  double utilization = 8;
  uint64 target_working_set_bytes = 9;
  uint64 overhead_bytes = 10;
  // Static manifest-derived lower-bound/payload-size estimate copied from the
  // model bundle. Not a runtime memory probe and not an enforcement input in
  // this slice; observe-only and non-gating.
  uint64 resident_memory_bytes = 11;
  uint64 estimated_headroom_bytes = 12;
  uint64 kv_cache_bytes_per_token = 13;
  uint64 prefill_workspace_bytes_per_token = 14;
  // Memory-policy-derived context recommendation. Observe-only and non-gating;
  // 0 means unknown or not computable. Never overrides catalog max_context_tokens.
  uint64 recommended_context_tokens = 15;
}

message WorkerPrefixCacheStatus {
  string implementation = 1;
  bool enabled = 2;
  uint32 entry_count = 3;
  uint64 total_bytes = 4;
  uint64 hits = 5;
  uint64 misses = 6;
  uint64 failures = 7;
  uint64 stores = 8;
  uint64 evictions = 9;
  uint32 configured_max_entries = 10;
  uint64 configured_max_bytes = 11;
  // Observe-only status vocabulary in the current slice:
  // ok | disabled | unavailable | invalid_status | error.
  // Non-enforcement: prefix-cache status is informational in this slice and
  // MUST NOT alter runtime readiness, request admission, model admission,
  // scheduler eligibility, queue ordering, hosted-tool eligibility, or
  // memory_budget_mode enforcement.
  string status_code = 12;
  string status_message = 13;
  uint64 session_started_unix_ms = 14;
  repeated string prefix_cache_fingerprints = 15;
}

// One indivisible unit of capability evidence. Every scalar is required inside
// a present profile; a zero or empty required value is malformed. Repeated
// fields are sets attached to this one profile and never combine across
// profiles (no cross-profile Cartesian product may be inferred).
// Identifier tokens (profile_id, artifact_format, acceleration, device_binding,
// memory_semantics, runtime_features, cache_capabilities) match
// ^[a-z0-9][a-z0-9_.-]{0,63}$.
// Bounds: at most 64 runtime_features and 64 cache_capabilities per profile.
message WorkerCapabilityProfile {
  // Unique within one WorkerCapabilities response.
  string profile_id = 1;
  string artifact_format = 2;
  string acceleration = 3;
  string device_binding = 4;
  string memory_semantics = 5;
  // Required, >= 1.
  uint32 max_concurrency = 6;
  // Sorted unique tokens.
  repeated string runtime_features = 7;
  // Sorted unique tokens.
  repeated string cache_capabilities = 8;
}

// Additive capability envelope on GetStatus. An omitted envelope means absent.
// Inside a present envelope every required scalar must be non-zero/non-empty;
// a zero or empty required value is malformed. protocol_minor may be 0.
// Non-gating: observe-only in this slice: capability evidence MUST NOT alter
// readiness, request admission, model admission, placement capacity, scheduler
// eligibility, retry, or Runtime Endpoint projection.
message WorkerCapabilities {
  // Required, >= 1. Only the major is a compatibility input.
  uint32 protocol_major = 1;
  // Additive revisions bump the minor; 0 is valid.
  uint32 protocol_minor = 2;
  // Required identifier token matching ^[a-z0-9][a-z0-9_.-]{0,63}$, e.g. "mlx".
  // Diagnostic only; never a compatibility or provider-inference input.
  string provider_id = 3;
  // Required version string: non-empty, at most 128 bytes, printable ASCII.
  string provider_version = 4;
  // Required version string: non-empty, at most 128 bytes, printable ASCII.
  string implementation_version = 5;
  // Required identifier token matching ^[a-z0-9][a-z0-9_.-]{0,63}$. Non-secret,
  // generated once per worker process start; safe to log.
  string service_incarnation = 6;
  // At most 64 profiles. Empty is valid and proves nothing.
  repeated WorkerCapabilityProfile profiles = 7;
  // field 8 reserved for a future loaded_binding (WorkerLoadedBinding).
  // The owner-confirmed documentation-only schema record is in
  // openspec/changes/define-negotiated-reasoning-runtime-encoding/design.md §2.1.
  // Keep this reservation until the separate accepted schema package and durable
  // decision record required by that design are accepted; do not substitute a tag
  // or shape before then.
  reserved 8;
}

message WorkerStatusResponse {
  bool loaded = 1;
  // Active Generate calls in this worker process.
  uint32 active_request_count = 2;
  bool ready = 3;
  string health_code = 4;
  string health_message = 5;
  WorkerMemoryBudgetStatus memory_budget = 6;
  WorkerPrefixCacheStatus prefix_cache = 7;
  bool supports_prompt_token_ids = 8;
  // Effective overlapping Generate capacity for this worker. Node agents treat
  // absent or zero values as capacity 1.
  uint32 max_concurrency = 9;
  // Observe-only capability evidence; nil/omitted means absent. Non-gating in
  // this slice (see WorkerCapabilities).
  WorkerCapabilities capabilities = 10;
}

message LoadModelRequest {
  string model_id = 1;
  string version = 2;
  string model_path = 3;
}

service WorkerRuntimeService {
  rpc GetStatus(WorkerStatusRequest) returns (WorkerStatusResponse);
  rpc LoadModel(LoadModelRequest) returns (cluster.v1.Ack);
  rpc UnloadModel(cluster.v1.UnloadModelRequest) returns (cluster.v1.Ack);
  rpc Generate(cluster.v1.ExecuteInferenceRequest) returns (stream cluster.v1.InferenceEvent);
  rpc Cancel(cluster.v1.CancelInferenceRequest) returns (cluster.v1.Ack);
  // Phase 4D selected-candidate observe-only score path.
  // Worker accepts only cache_affinity_fingerprint HMAC input in v1; prompt
  // bytes and token IDs are explicitly out of scope for this RPC.
  // Default-off/fail-open behavior is enforced by node-agent/controller callers.
  rpc ScorePrefixCache(cluster.v1.ScorePrefixCacheRequest)
      returns (cluster.v1.ScorePrefixCacheResponse);
}
