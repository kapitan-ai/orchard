syntax = "proto3";

package cluster.v1;

import "cluster/v1/common.proto";
import "cluster/v1/events.proto";
import "cluster/v1/reasoning.proto";

// Compatibility transport for Runtime Endpoint operations.
// The transport-independent Runtime Endpoint Interface is the Controller
// domain contract for runtime execution.
service NodeRuntimeService {
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc EnsureModelLoaded(EnsureModelLoadedRequest) returns (EnsureModelLoadedResponse);
  rpc UnloadModel(UnloadModelRequest) returns (Ack);
  rpc ExecuteInference(ExecuteInferenceRequest) returns (stream InferenceEvent);
  rpc CancelInference(CancelInferenceRequest) returns (Ack);
  // Phase 4D selected-candidate observe-only score path.
  // Default-off and fail-open: non-ok statuses and transport failures are
  // rank-neutral scheduler-internal telemetry and MUST NOT become tenant-facing
  // request failures.
  rpc ScorePrefixCache(ScorePrefixCacheRequest) returns (ScorePrefixCacheResponse);
}

message StatusRequest {
  ReasoningObservationRequest reasoning_observation = 1;
}

// Node metadata reported by the node-agent alongside runtime status.
message RuntimeNodeMetadata {
  string node_id = 1;
  string display_name = 2;
  string hostname = 3;
  string agent_version = 4;
  string listen_host = 5;
  uint32 listen_port = 6;
  string worker_backend = 7;
}

// Aggregated runtime health derived from worker state and health probes.
message RuntimeHealth {
  bool ready = 1;
  string health_code = 2;
  string health_message = 3;
  ModelRef affected_model = 4;
}

// Observe-only memory-budget snapshot for one loaded runtime/model.
// When controller memory_admission.enabled is true, Orchard.Scheduler.MultiNode
// may use only status_code == "ok" plus headroom_available == true as a
// positive, non-excluding ranking preference. Absent, malformed, unavailable,
// non-ok, or headroom-unavailable telemetry remains rank-neutral and fail-open.
message RuntimeMemoryBudget {
  ModelRef model_ref = 1;
  string mode = 2;
  bool budget_available = 3;
  bool headroom_available = 4;
  // Observe-only status vocabulary in the current slice:
  // ok | disabled | device_info_unavailable | device_info_invalid |
  // resident_memory_unavailable | compute_failed | invalid_status.
  // Non-enforcement: status_code is not an enforcement input in this slice and
  // MUST NOT alter readiness, request admission, model admission, scheduler
  // eligibility, hosted-tool eligibility, public errors, queue ordering, or
  // memory_budget_mode enforcement. The sole Phase 4E scheduler exception is
  // the hard-coded status_code == "ok" plus headroom_available == true positive
  // ranking preference described above.
  string status_code = 5;
  string status_message = 6;
  string source = 7;
  uint64 max_recommended_working_set_size_bytes = 8;
  double utilization = 9;
  uint64 target_working_set_bytes = 10;
  uint64 overhead_bytes = 11;
  // Static manifest-derived lower-bound/payload-size estimate copied from the
  // model bundle. Not a runtime memory probe and not an enforcement input in
  // this slice; observe-only and non-gating.
  uint64 resident_memory_bytes = 12;
  uint64 estimated_headroom_bytes = 13;
  uint64 kv_cache_bytes_per_token = 14;
  uint64 prefill_workspace_bytes_per_token = 15;
  // Memory-policy-derived context recommendation. Observe-only and non-gating;
  // 0 means unknown or not computable. Never overrides catalog max_context_tokens.
  uint64 recommended_context_tokens = 16;
}

// Observe-only aggregate prefix-cache snapshot for one loaded runtime/model.
message RuntimePrefixCacheStatus {
  ModelRef model_ref = 1;
  string implementation = 2;
  bool enabled = 3;
  uint32 entry_count = 4;
  uint64 total_bytes = 5;
  uint64 hits = 6;
  uint64 misses = 7;
  uint64 failures = 8;
  uint64 stores = 9;
  uint64 evictions = 10;
  uint32 configured_max_entries = 11;
  uint64 configured_max_bytes = 12;
  // Observe-only status vocabulary in the current slice:
  // ok | disabled | unavailable | invalid_status | error.
  // Non-enforcement: prefix-cache status is informational in this slice and
  // MUST NOT alter runtime readiness, request admission, model admission,
  // scheduler eligibility, queue ordering, hosted-tool eligibility, or
  // memory_budget_mode enforcement.
  string status_code = 13;
  string status_message = 14;
  uint64 session_started_unix_ms = 15;
  repeated string prefix_cache_fingerprints = 16;
}

// Static hosted-tool capability advertised by the node. The controller derives
// canonical identity as tool://<name>@<version> and matches against the tool
// registry using the same name/version semantics.
message HostedToolCapability {
  string name = 1;
  string version = 2;
  string adapter_kind = 3;
}

// Dynamic hosted-tool readiness reported separately from static capability.
// Readiness entries without matching capability should be ignored by the
// controller. Absent readiness/capability lists mean the node advertises no
// hosted tools.
message HostedToolReadiness {
  string name = 1;
  string version = 2;
  bool ready = 3;
  string readiness_code = 4;
  string readiness_message = 5;
}

// Per-loaded-model runtime concurrency status. An absent or empty list means
// model-placement capacity is unknown to the controller and must not be treated
// as a status-probe error. Controller scheduler use requires exactly one
// matching entry with active_request_count >= 0 and max_concurrency > 0, and
// still depends on node-level StatusResponse capacity having room.
message RuntimeModelPlacement {
  ModelRef model_ref = 1;
  uint32 active_request_count = 2;
  uint32 max_concurrency = 3;
}

// Bounded process-lifetime monotonic crash count for one model identifier.
// counter_version is controller-internal deduplication state and is never a
// Prometheus label.
message WorkerCrashCounter {
  string model_id = 1;
  uint64 count = 2;
  string counter_version = 3;
}

// Evidence state describes whether a bounded observation was obtained. It does
// not describe device health, readiness, availability for work, or custody.
enum HostEvidenceState {
  HOST_EVIDENCE_STATE_UNSPECIFIED = 0;
  HOST_EVIDENCE_STATE_OBSERVED = 1;
  HOST_EVIDENCE_STATE_ABSENT = 2;
  HOST_EVIDENCE_STATE_PARTIAL = 3;
  HOST_EVIDENCE_STATE_ERROR = 4;
}

enum HostInventoryAuthority {
  HOST_INVENTORY_AUTHORITY_UNSPECIFIED = 0;
  HOST_INVENTORY_AUTHORITY_OBSERVATION_ONLY = 1;
}

enum AcceleratorVendor {
  ACCELERATOR_VENDOR_UNSPECIFIED = 0;
  ACCELERATOR_VENDOR_NVIDIA = 1;
  ACCELERATOR_VENDOR_AMD = 2;
}

message HostEvidence {
  HostEvidenceState state = 1;
  string source = 2;
  uint64 observed_at_unix_ms = 3;
  // Stable bounded code only; raw command output is not transported.
  string error_code = 4;
}

message HostCpuObservation {
  HostEvidence evidence = 1;
  string architecture = 2;
  uint32 logical_processor_count = 3;
  uint32 core_count = 4;
  uint32 socket_count = 5;
  string vendor_id = 6;
  string model_name = 7;
}

message HostMemoryObservation {
  HostEvidence evidence = 1;
  uint64 physical_bytes = 2;
  uint64 available_bytes = 3;
  uint64 swap_total_bytes = 4;
  uint64 swap_free_bytes = 5;
}

message HostDiskObservation {
  HostEvidence evidence = 1;
  string mount_point = 2;
  string filesystem = 3;
  uint64 total_bytes = 4;
  uint64 available_bytes = 5;
}

message HostPlatformObservation {
  HostEvidence evidence = 1;
  string os_id = 2;
  string os_name = 3;
  string os_version = 4;
  string kernel_release = 5;
  string architecture = 6;
  string libc_name = 7;
  string libc_version = 8;
  string systemd_version = 9;
  string cgroup_mode = 10;
}

message HostNetworkAddressObservation {
  string family = 1;
  string address = 2;
  uint32 prefix_length = 3;
  string scope = 4;
}

message HostNetworkInterfaceObservation {
  string name = 1;
  uint32 index = 2;
  string oper_state = 3;
  uint32 mtu = 4;
  string link_type = 5;
  string hardware_address = 6;
  repeated HostNetworkAddressObservation addresses = 7;
}

message HostNetworkObservation {
  HostEvidence evidence = 1;
  repeated HostNetworkInterfaceObservation interfaces = 2;
}

message AcceleratorObservation {
  HostEvidence evidence = 1;
  AcceleratorVendor vendor = 2;
  // Vendor-documented stable identity. Records without one are omitted.
  string stable_id = 3;
  string identity_kind = 4;
  // Topology observations only; none is an Orchard device binding.
  uint32 device_ordinal = 5;
  string pci_address = 6;
  string numa_node = 7;
  string model_name = 8;
  uint64 memory_total_bytes = 9;
  string driver_version = 10;
}

message AcceleratorRuntimeObservation {
  HostEvidence evidence = 1;
  // Installed host tool or runtime evidence only, never provider qualification
  // or proof that a particular accelerator can execute it.
  string name = 2;
  string version = 3;
}

message AcceleratorProviderObservation {
  HostEvidence evidence = 1;
  AcceleratorVendor vendor = 2;
  repeated AcceleratorObservation devices = 3;
  // Observed process environment only; never an Orchard allocation or binding.
  string visibility_filter = 4;
  AcceleratorRuntimeObservation runtime = 5;
}

// Bounded observation-only host inventory. It creates no capacity, worker
// unit, resource allocation, device binding, readiness, or custody fact.
message HostInventoryObservation {
  uint32 schema_version = 1;
  uint64 observed_at_unix_ms = 2;
  HostInventoryAuthority authority = 3;
  HostCpuObservation cpu = 4;
  HostMemoryObservation memory = 5;
  HostDiskObservation disk = 6;
  HostPlatformObservation platform = 7;
  HostNetworkObservation network = 8;
  repeated AcceleratorProviderObservation accelerator_providers = 9;
}

// M1 assumes one effective worker/runtime path per node for the single-node MVP.
// Fields 4-5 added for persistent node inventory (M3a Session 1).
message StatusResponse {
  WorkerState worker_state = 1;
  repeated ModelRef loaded_models = 2;
  // Active runtime requests across the node.
  uint32 active_request_count = 3;
  RuntimeNodeMetadata node_metadata = 4;
  RuntimeHealth runtime_health = 5;
  repeated HostedToolCapability hosted_tool_capabilities = 6;
  repeated HostedToolReadiness hosted_tool_readiness = 7;
  repeated RuntimeMemoryBudget runtime_memory_budgets = 8;
  repeated RuntimePrefixCacheStatus runtime_prefix_cache_statuses = 9;
  bool supports_prompt_token_ids = 10;
  repeated RuntimeModelPlacement runtime_model_placements = 11;
  // Aggregate runtime request capacity for the node. Controllers must treat
  // absent or zero values as node capacity 1.
  uint32 max_concurrency = 12;
  repeated WorkerCrashCounter worker_crash_counters = 13;
  ReasoningLiveObservation reasoning_observation = 14;
  // Additive observation-only host evidence. Absence means not observed and
  // creates no readiness, scheduling, allocation, provider, or custody fact.
  HostInventoryObservation host_inventory = 15;
}

message EnsureModelLoadedRequest {
  // Included per SPEC.md §7.5.3. The node agent should validate or ignore any
  // mismatch against its own authenticated node identity.
  string node_id = 1;
  string model_id = 2;
  string version = 3;
  string artifact_sha256 = 4;
  bool preload = 5;
  uint64 deadline_unix_ms = 6;
  string artifact_source_uri = 7;
}

message EnsureModelLoadedResponse {
  bool already_loaded = 1;
  PlacementState placement_state = 2;

  // Meaningful when placement_state == PLACEMENT_STATE_FAILED.
  ModelLoadFailureCategory failure_category = 3;
  string failure_code = 4;
  string failure_message = 5;

  bool worker_supports_prompt_token_ids = 6;
  optional RuntimeModelPlacement placement_capacity = 7;
}

message UnloadModelRequest {
  string model_id = 1;
  string version = 2;
  bool force = 3;
  bool evict = 4;
}

message ScorePrefixCacheRequest {
  string request_id = 1;
  string controller_session_id = 2;
  ModelRef model_ref = 3;
  // Opaque HMAC fingerprint (hmac-sha256:<64 lowercase hex>) with the same
  // derivation as ExecuteInferenceRequest.cache_affinity_fingerprint.
  // No prompt bytes or token IDs are included on this RPC in v1.
  string cache_affinity_fingerprint = 4;
  uint64 deadline_unix_ms = 5;
}

message ScorePrefixCacheResponse {
  // Observe-only status vocabulary in this slice:
  // ok | disabled | unavailable | model_not_loaded | timeout |
  // invalid_request | error | unsupported_version.
  // Any non-ok status is fail-open and rank-neutral in v1.
  string status_code = 1;
  string status_message = 2;
  // True iff fingerprint is currently associated with a resident
  // prefix-cache entry.
  bool resident_fingerprint_match = 3;
  // resident_fingerprint | recent_fingerprint_only | no_match | unknown.
  // recent_fingerprint_only is diagnostic/approximate only and MUST NOT be
  // treated as authoritative residency.
  string score_tier = 4;
  uint64 session_started_unix_ms = 5;
}

message ExecuteInferenceRequest {
  string request_id = 1;
  string controller_session_id = 2;
  string model_id = 3;
  string version = 4;
  // Kept as bytes to match SPEC.md §7.5.3 verbatim.
  bytes rendered_prompt_utf8 = 5;
  uint32 input_tokens = 6;
  GenerationParams params = 7;
  uint64 deadline_unix_ms = 8;
  bytes metadata_json = 9;
  string cache_affinity_fingerprint = 10;
  repeated uint32 prompt_token_ids = 11;
  bool return_token_ids = 12;
  bool return_logprobs = 13;
  PreparationRedemption preparation_redemption = 14;
}

message CancelInferenceRequest {
  string request_id = 1;
  string controller_session_id = 2;
}
