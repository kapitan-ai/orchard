syntax = "proto3";

package cluster.v1;

// Ack is reserved for successful/idempotent negatives on RPCs that return a
// payload despite using gRPC status. Actual failures should use non-OK gRPC
// status codes rather than Ack{ok: false}.
message Ack {
  bool ok = 1;
  string message = 2;
}

message ModelRef {
  string model_id = 1;
  string version = 2;
}

message TokenUsage {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 total_tokens = 3;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  WORKER_STATE_STARTING = 1;
  WORKER_STATE_IDLE = 2;
  WORKER_STATE_BUSY = 3;
  WORKER_STATE_STOPPING = 4;
  WORKER_STATE_FAILED = 5;
  WORKER_STATE_STOPPED = 6;
}

enum PlacementState {
  PLACEMENT_STATE_UNSPECIFIED = 0;
  PLACEMENT_STATE_ABSENT = 1;
  PLACEMENT_STATE_DOWNLOADING = 2;
  PLACEMENT_STATE_DOWNLOADED = 3;
  PLACEMENT_STATE_VERIFYING = 4;
  PLACEMENT_STATE_CACHED = 5;
  PLACEMENT_STATE_LOADING = 6;
  PLACEMENT_STATE_LOADED = 7;
  PLACEMENT_STATE_UNLOADING = 8;
  PLACEMENT_STATE_EVICTED = 9;
  PLACEMENT_STATE_FAILED = 10;
}

enum ModelLoadFailureCategory {
  MODEL_LOAD_FAILURE_CATEGORY_UNSPECIFIED = 0;
  MODEL_LOAD_FAILURE_CATEGORY_MODEL_INVALID = 1;
  MODEL_LOAD_FAILURE_CATEGORY_ACQUISITION_FAILED = 2;
  MODEL_LOAD_FAILURE_CATEGORY_RUNTIME_UNAVAILABLE = 3;
  MODEL_LOAD_FAILURE_CATEGORY_TIMEOUT = 4;
  MODEL_LOAD_FAILURE_CATEGORY_RESOURCE_EXHAUSTED = 5;
  MODEL_LOAD_FAILURE_CATEGORY_INTERNAL = 6;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
}

message GenerationParams {
  uint32 max_output_tokens = 1;
  double temperature = 2;
  double top_p = 3;
  repeated string stop_sequences = 4;
}
