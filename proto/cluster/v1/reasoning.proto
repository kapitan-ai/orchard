syntax = "proto3";

package cluster.v1;

import "cluster/v1/common.proto";

// Shared negotiated reasoning wire types (SPEC.md §7.5.3a). Dormant: no
// production binding advertises or selects a tuple until activation is
// authorized. Message-typed fields below are presence-aware: an absent message
// is distinct from a present message whose members are all defaults.

enum ReasoningEffort {
  // Invalid inside a present ReasoningEffortSelection.
  REASONING_EFFORT_UNSPECIFIED = 0;
  REASONING_EFFORT_LOW = 1;
  REASONING_EFFORT_MEDIUM = 2;
  REASONING_EFFORT_HIGH = 3;
}

// Absent wrapper means the negotiated nil effort. A present wrapper must carry
// LOW, MEDIUM, or HIGH; present UNSPECIFIED is invalid. A selected tier is
// valid only for generation_policy = enabled and projection = final_only.
message ReasoningEffortSelection {
  ReasoningEffort effort = 1;
}

// Every string is required and non-empty when the binding is present.
message WorkerLoadedBinding {
  string model_id = 1;
  string model_version = 2;
  string artifact_digest = 3;
  string selected_profile_id = 4;
}

// Indivisible eleven-field tuple. Every string is required and non-empty;
// reasoning_effort follows ReasoningEffortSelection presence.
message NegotiatedReasoningTuple {
  string generation_policy = 1;
  string projection = 2;
  ReasoningEffortSelection reasoning_effort = 3;
  string model_artifact_digest = 4;
  string chat_template_digest = 5;
  string render_contract = 6;
  string render_contract_version = 7;
  string parser_family = 8;
  string parser_version = 9;
  string runtime_contract_version = 10;
  string event_binding_version = 11;
}

message ReasoningEvidenceEnvelope {
  // 0..16 complete, unique, non-conflicting tuples. A valid empty list is
  // confirmed non-support.
  repeated NegotiatedReasoningTuple tuples = 1;
  // Required, exactly 16 raw bytes.
  bytes loaded_instance_id = 2;
}

// Opt-in live observation selector. Absent means the legacy projection.
// Emitted only for an explicit negotiated Request to a compatible binding.
message ReasoningObservationRequest {
  // Required, with non-empty model_id and version.
  ModelRef model_ref = 1;
}

// All four members are required when present. remaining_freshness_ms must be
// positive to prove selection.
message ReasoningEvidence {
  WorkerLoadedBinding loaded_binding = 1;
  ReasoningEvidenceEnvelope envelope = 2;
  string service_incarnation = 3;
  uint64 remaining_freshness_ms = 4;
}

message ReasoningNonAdvertising {}

message ReasoningUnknown {}

// Exactly one result is set. An unset result is incomplete and classifies as
// unknown.
message ReasoningLiveObservation {
  oneof result {
    ReasoningEvidence evidence = 1;
    ReasoningNonAdvertising non_advertising = 2;
    ReasoningUnknown unknown = 3;
  }
}

// Frozen snapshot of ExecuteInferenceRequest fields 1-13, matching name, tag,
// type, and cardinality. Members keep their existing optional/default
// semantics. ExecuteInferenceRequest field 14 is excluded.
message FrozenExecutionInput {
  string request_id = 1;
  string controller_session_id = 2;
  string model_id = 3;
  string version = 4;
  bytes rendered_prompt_utf8 = 5;
  uint32 input_tokens = 6;
  GenerationParams params = 7;
  uint64 deadline_unix_ms = 8;
  bytes metadata_json = 9;
  string cache_affinity_fingerprint = 10;
  repeated uint32 prompt_token_ids = 11;
  bool return_token_ids = 12;
  bool return_logprobs = 13;
}

// Every outer member is required; strings are non-empty and
// expected_loaded_instance_id is exactly 16 raw bytes.
message PrepareInferenceRequest {
  FrozenExecutionInput input = 1;
  NegotiatedReasoningTuple tuple = 2;
  WorkerLoadedBinding expected_binding = 3;
  string expected_service_incarnation = 4;
  bytes expected_loaded_instance_id = 5;
}

// Every member is required; strings are non-empty and loaded_instance_id is
// exactly 16 raw bytes.
message PrepareInferenceProof {
  string request_id = 1;
  string controller_session_id = 2;
  NegotiatedReasoningTuple tuple = 3;
  WorkerLoadedBinding actual_binding = 4;
  string service_incarnation = 5;
  bytes loaded_instance_id = 6;
}

// Absent on legacy execution. Required for negotiated execution and validated
// independently of the frozen input.
message PreparationRedemption {
  // Exactly 32 worker-issued bytes; never logged or persisted.
  bytes authorization = 1;
}

message PrepareInferenceResponse {
  PrepareInferenceProof proof = 1;
  // Exactly 32 worker-issued bytes; never logged or persisted.
  bytes authorization = 2;
  // Positive, Worker-monotonic.
  uint64 authorization_ttl_ms = 3;
}
