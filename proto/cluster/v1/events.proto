syntax = "proto3";

package cluster.v1;

import "cluster/v1/common.proto";

// ExecuteInference streams events in order:
// - Accepted, before long-running prefill starts
// - zero or more progress/usage/output deltas
// - exactly one terminal Completed or Failed event
// - no additional events after the terminal event
message InferenceEvent {
  oneof event {
    Accepted accepted = 1;
    OutputTextDelta output_text_delta = 2;
    ToolCallDelta tool_call_delta = 3;
    UsageUpdate usage = 4;
    Completed completed = 5;
    Failed failed = 6;
    Progress progress = 7;
    TokenDelta token_delta = 8;
  }
}

message Accepted {
  uint64 accepted_at_unix_ms = 1;
}

message OutputTextDelta {
  string delta = 1;
}

// Emitted only when the request opts in.
// Logprobs, when requested and available, align index-wise with token_ids.
// Token deltas reflect raw sampled tokens and may not align 1:1 with
// detokenized text deltas.
// TokenDelta is never emitted after the terminal event.
message TokenDelta {
  repeated uint32 token_ids = 1;
  repeated float logprobs = 2;
}

// Tool-call deltas stream partial tool-call metadata and function arguments.
// delta_json carries the incremental JSON payload defined in SPEC.md §7.2.5.
message ToolCallDelta {
  string tool_call_id = 1;
  string delta_json = 2;
}

message UsageUpdate {
  TokenUsage usage = 1;
}

message Completed {
  FinishReason finish_reason = 1;
  TokenUsage usage = 2;
}

message Failed {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message Progress {
  string stage = 1;
  string message = 2;
}
